name: ingress_event_tracker
description: A companion app to monitor and schedule local notifications for Ingress gameplay modifications.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # For fetching events database from static host (GitHub Pages/Raw)
  http: ^1.2.0

  # Client-side notifications and scheduling
  flutter_local_notifications: ^17.1.0
  
  # Timezone databases and calculations
  timezone: ^0.9.2
  flutter_timezone: ^3.0.1
  
  # Helper to format display dates
  intl: ^0.19.0

  # Persistent key-value storage for settings
  shared_preferences: ^2.2.0

  # Launching URLs in system browser
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
